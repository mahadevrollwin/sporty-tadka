<!DOCTYPE html>
<html lang="en">
  <head>

    <style>
      #loading-fallback {

      #unsupported-browser {

        background: rgba(0, 0, 0, 0.75);

  <body>
    <div id="root">
      <div id="loading-fallback">
        <p style="font-size: 1.25rem; font-weight: 600;">Loading Scam Alert Challenge…</p>
        <p>Please wait a moment.</p>
        <div id="unsupported-browser">
          <p style="font-weight: 600; margin-bottom: 0.75rem;">Your browser is too old to run this app.</p>
          <p style="font-size: 0.9rem;">Please update iOS/Safari, or open this page on a newer phone, tablet, or computer.</p>

        JavaScript is required to play the Scam Alert Challenge. Please enable JavaScript and reload.
      </p>
    </noscript>
    <script>
      setTimeout(function () {
        var fallback = document.getElementById("loading-fallback");
        var unsupported = document.getElementById("unsupported-browser");
        if (fallback && unsupported && document.getElementById("root").childElementCount === 1) {
          unsupported.style.display = "block";
        }
      }, 8000);
    </script>
